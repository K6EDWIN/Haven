<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8faf7" />
    <meta name="description" content="A private, supportive space with Haven." />
    <link rel="icon" type="image/png" href="/brand/loading-icon.png" />
    <title>Haven</title>
    <style>
      html,body,#root{margin:0;min-height:100%;background:#f8faf7}
      #boot-splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#f8faf7;transition:opacity .25s ease}
      #boot-splash img{width:132px;height:132px;object-fit:contain;animation:haven-breathe 1.1s ease-in-out infinite alternate}
      #boot-splash.hide{opacity:0;pointer-events:none}
      @keyframes haven-breathe{to{transform:scale(1.045);opacity:.78}}
      @media(prefers-reduced-motion:reduce){#boot-splash img{animation:none}}
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-label="Loading Haven"><img src="/brand/loading-icon.png" alt="Haven" /></div>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
